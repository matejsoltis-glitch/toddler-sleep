YAML
name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout kód
        uses: actions/checkout@v4

      - name: Nastavenie Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Nastavenie Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Nastavenie Android SDK
        uses: android-actions/setup-android@v3

      - name: Inštalácia závislostí a zostavenie webu
        run: |
          npm install
          npm run build || true
          npx cap init "Toddler Sleep Assistant" "com.toddler.sleep.assistant" --web-dir dist || npx cap init "Toddler Sleep Assistant" "com.toddler.sleep.assistant" --web-dir .
          npm install @capacitor/android @capacitor/assets
          npx cap add android
          npx @capacitor/assets generate --android
          npx cap sync android

      - name: Zostavenie APK (Debug)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Uloženie APK ako artefakt
        uses: actions/upload-artifact@v4
        with:
          name: moja-aplikacia-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
