- name: Add and Sync Android platform
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          # Nastavenie minimálnej SDK verzie na 24 pre požiadavku Google Play
          sed -i 's/minSdkVersion = [0-9]*/minSdkVersion = 24/g' android/variables.gradle
          npx cap sync android
