name: Build and Sign AAB

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Install dependencies
        run: |
          npm install --legacy-peer-deps
          npm install --legacy-peer-deps @capacitor/core @capacitor/cli @capacitor/android @capacitor/assets

      - name: Build web assets
        run: npm run build

      - name: Add Android platform
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi

      - name: Generate Android App Icons from assets/icon.png
        run: |
          # 1. Príprava zdrojových súborov pre @capacitor/assets
          mkdir -p assets
          cp -f assets/icon.png assets/icon-only.png 2>/dev/null || true
          cp -f assets/icon.png assets/icon-foreground.png 2>/dev/null || true
          cp -f assets/icon.png assets/logo.png 2>/dev/null || true

          # 2. Automatické vygenerovanie cez @capacitor/assets
          npx @capacitor/assets generate --android --assetPath assets || true

          # 3. Istota: Priamy prevod do všetkých mipmap rozlíšení (mdpi, hdpi, xhdpi, xxhdpi, xxxhdpi)
          for density in "mdpi:48:108" "hdpi:72:162" "xhdpi:96:216" "xxhdpi:144:324" "xxxhdpi:192:432"; do
            IFS=":" read -r name size fg_size <<< "$density"
            dir="android/app/src/main/res/mipmap-$name"
            mkdir -p "$dir"
            if command -v convert >/dev/null 2>&1; then
              convert assets/icon.png -resize "${size}x${size}" "$dir/ic_launcher.png" || true
              convert assets/icon.png -resize "${size}x${size}" "$dir/ic_launcher_round.png" || true
              convert assets/icon.png -resize "${fg_size}x${fg_size}" "$dir/ic_launcher_foreground.png" || true
            fi
          done

      - name: Configure Android versions and Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          node -e '
            const fs = require("fs");

            // 1. Dekódovanie keystore zo secretu
            const rawBase64 = (process.env.KEYSTORE_BASE64 || "").replace(/\s+/g, "");
            fs.writeFileSync("android/app/release.keystore", Buffer.from(rawBase64, "base64"));

            // 2. Nastavenie SDK 36 vo variables.gradle
            let vg = fs.readFileSync("android/variables.gradle", "utf8");
            vg = vg.replace(/minSdkVersion\s*=\s*[0-9]+/g, "minSdkVersion = 24");
            vg = vg.replace(/compileSdkVersion\s*=\s*[0-9]+/g, "compileSdkVersion = 36");
            vg = vg.replace(/targetSdkVersion\s*=\s*[0-9]+/g, "targetSdkVersion = 36");
            fs.writeFileSync("android/variables.gradle", vg);

            // 3. Nastavenie verzie 1.1.0 a versionCode 5
            let bg = fs.readFileSync("android/app/build.gradle", "utf8");
            bg = bg.replace(/versionCode\s+[0-9]+/g, "versionCode 5");
            bg = bg.replace(/versionName\s+"[^"]+"/g, "versionName \"1.1.0\"");
            fs.writeFileSync("android/app/build.gradle", bg);

            // 4. Potlačenie AGP kontroly pre SDK 36
            fs.appendFileSync("android/gradle.properties", "\nandroid.suppressUnsupportedCompileSdk=36\n");
          '

          npx cap sync android

      - name: Configure Immersive Sticky Fullscreen & Lock Screen Sleep Plugin
        run: |
          # 1. Nastavenie okna na fullscreen v styles.xml
          if [ -f "android/app/src/main/res/values/styles.xml" ]; then
            sed -i '/<\/style>/i \        <item name="android:windowFullscreen">true</item>\n        <item name="android:windowContentOverlay">@null</item>' android/app/src/main/res/values/styles.xml || true
          fi

          # 2. Pridanie povolenia POST_NOTIFICATIONS do AndroidManifest.xml (pre Android 13+ zamknutú obrazovku)
          node -e '
            const fs = require("fs");
            const manifestPath = "android/app/src/main/AndroidManifest.xml";
            if (fs.existsSync(manifestPath)) {
              let xml = fs.readFileSync(manifestPath, "utf8");
              if (!xml.includes("android.permission.POST_NOTIFICATIONS")) {
                xml = xml.replace(
                  /<manifest([^>]*)>/,
                  "<manifest$1>\n    <uses-permission android:name=\"android.permission.POST_NOTIFICATIONS\" />"
                );
                fs.writeFileSync(manifestPath, xml);
              }
            }
          '

          # 3. Natívny Capacitor plugin pre tiché zobrazenie prebiehajúceho spánku na zamknutej obrazovke Androidu (so živým chronometrom)
          mkdir -p android/app/src/main/java/com/matej/toddlersleep
          cat << 'EOF' > android/app/src/main/java/com/matej/toddlersleep/SleepLockScreenNotificationPlugin.java
          package com.matej.toddlersleep;

          import android.Manifest;
          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.content.Context;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.os.Build;
          import androidx.core.app.NotificationCompat;
          import androidx.core.app.NotificationManagerCompat;
          import androidx.core.content.ContextCompat;
          import com.getcapacitor.JSObject;
          import com.getcapacitor.PermissionState;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;
          import com.getcapacitor.annotation.Permission;
          import com.getcapacitor.annotation.PermissionCallback;

          @CapacitorPlugin(
              name = "SleepLockScreenNotification",
              permissions = {
                  @Permission(
                      strings = { Manifest.permission.POST_NOTIFICATIONS },
                      alias = "notifications"
                  )
              }
          )
          public class SleepLockScreenNotificationPlugin extends Plugin {
              private static final String CHANNEL_ID = "ongoing_sleep_lockscreen_channel";
              private static final int NOTIFICATION_ID = 4041;

              private boolean hasNotificationPermission() {
                  if (Build.VERSION.SDK_INT < Build.VERSION_CODES.TIRAMISU) {
                      return true;
                  }
                  return ContextCompat.checkSelfPermission(
                      getContext(),
                      Manifest.permission.POST_NOTIFICATIONS
                  ) == PackageManager.PERMISSION_GRANTED;
              }

              private void ensureNotificationChannel(String channelName) {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      NotificationManager manager = (NotificationManager) getContext().getSystemService(Context.NOTIFICATION_SERVICE);
                      if (manager == null) return;
                      String safeName = (channelName != null && !channelName.isEmpty()) ? channelName : "Ongoing Sleep Tracker";
                      NotificationChannel channel = new NotificationChannel(
                          CHANNEL_ID,
                          safeName,
                          NotificationManager.IMPORTANCE_DEFAULT
                      );
                      channel.setSound(null, null);
                      channel.enableVibration(false);
                      channel.enableLights(false);
                      channel.setShowBadge(false);
                      channel.setLockscreenVisibility(Notification.VISIBILITY_PUBLIC);
                      manager.createNotificationChannel(channel);
                  }
              }

              @PluginMethod
              public void checkNotificationPermission(PluginCall call) {
                  JSObject ret = new JSObject();
                  ret.put("granted", hasNotificationPermission());
                  call.resolve(ret);
              }

              @PluginMethod
              public void requestNotificationPermission(PluginCall call) {
                  if (hasNotificationPermission()) {
                      JSObject ret = new JSObject();
                      ret.put("granted", true);
                      call.resolve(ret);
                      return;
                  }
                  requestPermissionForAlias("notifications", call, "notificationsPermsCallback");
              }

              @PermissionCallback
              private void notificationsPermsCallback(PluginCall call) {
                  boolean granted = getPermissionState("notifications") == PermissionState.GRANTED || hasNotificationPermission();
                  JSObject ret = new JSObject();
                  ret.put("granted", granted);
                  call.resolve(ret);
              }

              @PluginMethod
              public void showOngoingSleep(PluginCall call) {
                  if (!hasNotificationPermission()) {
                      JSObject ret = new JSObject();
                      ret.put("shown", false);
                      ret.put("reason", "permission_denied");
                      call.resolve(ret);
                      return;
                  }

                  String title = call.getString("title", "Baby is sleeping");
                  String body = call.getString("body", "");
                  String channelName = call.getString("channelName", "Ongoing Sleep Tracker");
                  long startTimeMs = call.getData().optLong("startTimeMs", System.currentTimeMillis());

                  ensureNotificationChannel(channelName);

                  Context context = getContext();
                  Intent launchIntent = new Intent(context, MainActivity.class);
                  launchIntent.setFlags(Intent.FLAG_ACTIVITY_SINGLE_TOP | Intent.FLAG_ACTIVITY_CLEAR_TOP);

                  PendingIntent contentIntent = PendingIntent.getActivity(
                      context,
                      NOTIFICATION_ID,
                      launchIntent,
                      PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE
                  );

                  NotificationCompat.Builder builder = new NotificationCompat.Builder(context, CHANNEL_ID)
                      .setSmallIcon(context.getApplicationInfo().icon)
                      .setContentTitle(title)
                      .setContentText(body)
                      .setWhen(startTimeMs > 0 ? startTimeMs : System.currentTimeMillis())
                      .setShowWhen(true)
                      .setUsesChronometer(true)
                      .setOngoing(true)
                      .setAutoCancel(false)
                      .setOnlyAlertOnce(true)
                      .setSilent(true)
                      .setCategory(NotificationCompat.CATEGORY_STATUS)
                      .setPriority(NotificationCompat.PRIORITY_DEFAULT)
                      .setVisibility(NotificationCompat.VISIBILITY_PUBLIC)
                      .setContentIntent(contentIntent);

                  try {
                      NotificationManagerCompat.from(context).notify(NOTIFICATION_ID, builder.build());
                      JSObject ret = new JSObject();
                      ret.put("shown", true);
                      call.resolve(ret);
                  } catch (SecurityException se) {
                      JSObject ret = new JSObject();
                      ret.put("shown", false);
                      ret.put("reason", "security_exception");
                      call.resolve(ret);
                  }
              }

              @PluginMethod
              public void hideOngoingSleep(PluginCall call) {
                  NotificationManagerCompat.from(getContext()).cancel(NOTIFICATION_ID);
                  JSObject ret = new JSObject();
                  ret.put("hidden", true);
                  call.resolve(ret);
              }
          }
          EOF

          # 4. Registrácia pluginu + Immersive Sticky režim v MainActivity.java pre staršie aj novšie Android zariadenia
          cat << 'EOF' > android/app/src/main/java/com/matej/toddlersleep/MainActivity.java
          package com.matej.toddlersleep;

          import android.os.Bundle;
          import android.view.View;
          import android.view.WindowManager;
          import androidx.core.view.WindowCompat;
          import androidx.core.view.WindowInsetsCompat;
          import androidx.core.view.WindowInsetsControllerCompat;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  registerPlugin(SleepLockScreenNotificationPlugin.class);
                  super.onCreate(savedInstanceState);
                  getWindow().addFlags(WindowManager.LayoutParams.FLAG_FULLSCREEN);
                  hideSystemUI();
              }

              @Override
              public void onWindowFocusChanged(boolean hasFocus) {
                  super.onWindowFocusChanged(hasFocus);
                  if (hasFocus) {
                      hideSystemUI();
                  }
              }

              private void hideSystemUI() {
                  // Podpora pre moderné Android zariadenia (API 30+)
                  WindowCompat.setDecorFitsSystemWindows(getWindow(), false);
                  WindowInsetsControllerCompat controller = new WindowInsetsControllerCompat(getWindow(), getWindow().getDecorView());
                  controller.hide(WindowInsetsCompat.Type.systemBars());
                  controller.setSystemBarsBehavior(WindowInsetsControllerCompat.BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE);

                  // Vynútenie Immersive Sticky režimu pre staršie Android verzie (skrytie navigačnej aj stavovej lišty)
                  getWindow().getDecorView().setSystemUiVisibility(
                      View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY
                      | View.SYSTEM_UI_FLAG_LAYOUT_STABLE
                      | View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION
                      | View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN
                      | View.SYSTEM_UI_FLAG_HIDE_NAVIGATION
                      | View.SYSTEM_UI_FLAG_FULLSCREEN
                  );
              }
          }
          EOF

      - name: Build Signed Android App Bundle (.aab)
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew bundleRelease \
            -Pandroid.injected.signing.store.file="$(pwd)/app/release.keystore" \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"

      - name: Cleanup Keystore
        if: always()
        run: |
          rm -f android/app/release.keystore

      - name: Upload Signed Android App Bundle (.aab)
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 7
