name: Generate Keystore, Build and Sign AAB

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate package-lock.json
        run: |
          npm install --package-lock-only --legacy-peer-deps

      - name: Commit package-lock.json
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: add package-lock.json" && git push)

      - name: Install dependencies
        run: |
          npm install --legacy-peer-deps
          npm install --legacy-peer-deps @capacitor/core @capacitor/cli @capacitor/android

      - name: Build web assets
        run: npm run build

      - name: Add and Sync Android platform
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'
          cache: 'gradle'

      # Vytvorenie kľúča s vaším aliasom a heslom
      - name: Generate New Keystore
        run: |
          keytool -genkeypair -v \
            -keystore android/app/toddler-release.keystore \
            -alias msglitchapps \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "X5o9bGziMf" \
            -keypass "X5o9bGziMf" \
            -dname "CN=ToddlerSleep, OU=App, O=MSGlitch, L=Kostolna, ST=Slovakia, C=SK"

      # Zostavenie Android balíka .AAB
      - name: Build Android App Bundle (.aab)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew bundleRelease

      # Podpísanie vygenerovaným kľúčom
      - name: Sign Android App Bundle
        run: |
          jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 \
            -keystore android/app/toddler-release.keystore \
            -storepass "X5o9bGziMf" \
            -keypass "X5o9bGziMf" \
            android/app/build/outputs/bundle/release/app-release.aab msglitchapps

      # Uloženie AAB a Keystore súboru do sťahovateľného archívu
      - name: Upload Signed AAB and Keystore
        uses: actions/upload-artifact@v4
        with:
          name: toddler-app-and-keystore
          path: |
            android/app/build/outputs/bundle/release/app-release.aab
            android/app/toddler-release.keystore
          retention-days: 7
