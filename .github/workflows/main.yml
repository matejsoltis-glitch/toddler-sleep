name: Build and Sign AAB

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Generate package-lock.json
        run: |
          npm install --package-lock-only --legacy-peer-deps

      - name: Commit package-lock.json
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: add package-lock.json" && git push)

      - name: Install dependencies
        run: |
          npm install --legacy-peer-deps
          npm install --legacy-peer-deps @capacitor/core @capacitor/cli @capacitor/android @capacitor/assets

      - name: Build web assets
        run: npm run build

      - name: Add Android platform
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi

      - name: Generate Android App Icons from assets/icon.png
        run: |
          # 1. Príprava zdrojových súborov pre @capacitor/assets
          mkdir -p assets
          cp -f assets/icon.png assets/icon-only.png 2>/dev/null || true
          cp -f assets/icon.png assets/icon-foreground.png 2>/dev/null || true
          cp -f assets/icon.png assets/logo.png 2>/dev/null || true

          # 2. Automatické vygenerovanie cez @capacitor/assets
          npx @capacitor/assets generate --android --assetPath assets || true

          # 3. Istota: Priamy prevod do všetkých mipmap rozlíšení (mdpi, hdpi, xhdpi, xxhdpi, xxxhdpi)
          for density in "mdpi:48:108" "hdpi:72:162" "xhdpi:96:216" "xxhdpi:144:324" "xxxhdpi:192:432"; do
            IFS=":" read -r name size fg_size <<< "$density"
            dir="android/app/src/main/res/mipmap-$name"
            mkdir -p "$dir"
            if command -v convert >/dev/null 2>&1; then
              convert assets/icon.png -resize "${size}x${size}" "$dir/ic_launcher.png" || true
              convert assets/icon.png -resize "${size}x${size}" "$dir/ic_launcher_round.png" || true
              convert assets/icon.png -resize "${fg_size}x${fg_size}" "$dir/ic_launcher_foreground.png" || true
            fi
          done

      - name: Configure Android versions and Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          node -e '
            const fs = require("fs");

            // 1. Dekódovanie keystore zo secretu
            const rawBase64 = (process.env.KEYSTORE_BASE64 || "").replace(/\s+/g, "");
            fs.writeFileSync("android/app/release.keystore", Buffer.from(rawBase64, "base64"));

            // 2. Nastavenie SDK 36 vo variables.gradle
            let vg = fs.readFileSync("android/variables.gradle", "utf8");
            vg = vg.replace(/minSdkVersion\s*=\s*[0-9]+/g, "minSdkVersion = 24");
            vg = vg.replace(/compileSdkVersion\s*=\s*[0-9]+/g, "compileSdkVersion = 36");
            vg = vg.replace(/targetSdkVersion\s*=\s*[0-9]+/g, "targetSdkVersion = 36");
            fs.writeFileSync("android/variables.gradle", vg);

            // 3. Nastavenie verzie 1.0.1 a versionCode 3
            let bg = fs.readFileSync("android/app/build.gradle", "utf8");
            bg = bg.replace(/versionCode\s+[0-9]+/g, "versionCode 3");
            bg = bg.replace(/versionName\s+"[^"]+"/g, "versionName \"1.0.1\"");
            fs.writeFileSync("android/app/build.gradle", bg);

            // 4. Potlačenie AGP kontroly pre SDK 36
            fs.appendFileSync("android/gradle.properties", "\nandroid.suppressUnsupportedCompileSdk=36\n");
          '

          npx cap sync android

      - name: Configure Immersive Sticky Fullscreen (MainActivity.java & styles.xml)
        run: |
          # 1. Nastavenie okna na fullscreen v styles.xml
          if [ -f "android/app/src/main/res/values/styles.xml" ]; then
            sed -i '/<\/style>/i \        <item name="android:windowFullscreen">true</item>\n        <item name="android:windowContentOverlay">@null</item>' android/app/src/main/res/values/styles.xml || true
          fi

          # 2. Vynútenie Immersive Sticky režimu v MainActivity.java pre staršie aj novšie Android zariadenia
          mkdir -p android/app/src/main/java/com/matej/toddlersleep
          cat << 'EOF' > android/app/src/main/java/com/matej/toddlersleep/MainActivity.java
          package com.matej.toddlersleep;

          import android.os.Bundle;
          import android.view.View;
          import android.view.WindowManager;
          import androidx.core.view.WindowCompat;
          import androidx.core.view.WindowInsetsCompat;
          import androidx.core.view.WindowInsetsControllerCompat;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  getWindow().addFlags(WindowManager.LayoutParams.FLAG_FULLSCREEN);
                  hideSystemUI();
              }

              @Override
              public void onWindowFocusChanged(boolean hasFocus) {
                  super.onWindowFocusChanged(hasFocus);
                  if (hasFocus) {
                      hideSystemUI();
                  }
              }

              private void hideSystemUI() {
                  // Podpora pre moderné Android zariadenia (API 30+)
                  WindowCompat.setDecorFitsSystemWindows(getWindow(), false);
                  WindowInsetsControllerCompat controller = new WindowInsetsControllerCompat(getWindow(), getWindow().getDecorView());
                  controller.hide(WindowInsetsCompat.Type.systemBars());
                  controller.setSystemBarsBehavior(WindowInsetsControllerCompat.BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE);

                  // Vynútenie Immersive Sticky režimu pre staršie Android verzie (skrytie navigačnej aj stavovej lišty)
                  getWindow().getDecorView().setSystemUiVisibility(
                      View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY
                      | View.SYSTEM_UI_FLAG_LAYOUT_STABLE
                      | View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION
                      | View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN
                      | View.SYSTEM_UI_FLAG_HIDE_NAVIGATION
                      | View.SYSTEM_UI_FLAG_FULLSCREEN
                  );
              }
          }
          EOF

      - name: Build Signed Android App Bundle (.aab)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew bundleRelease \
            -Pandroid.injected.signing.store.file="$(pwd)/app/release.keystore" \
            -Pandroid.injected.signing.store.password="X5o9bGziMf" \
            -Pandroid.injected.signing.key.alias="msglitchapps" \
            -Pandroid.injected.signing.key.password="X5o9bGziMf"

      - name: Export Upload Certificate from Secret
        run: |
          keytool -export -rfc \
            -keystore android/app/release.keystore \
            -alias msglitchapps \
            -file upload_certificate.pem \
            -storepass "X5o9bGziMf"

      - name: Cleanup Keystore
        run: |
          rm -f android/app/release.keystore

      - name: Upload Artifacts (AAB and PEM Certificate)
        uses: actions/upload-artifact@v4
        with:
          name: app-release-and-cert
          path: |
            android/app/build/outputs/bundle/release/*.aab
            upload_certificate.pem
          retention-days: 7
