name: Build and Sign AAB

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Generate package-lock.json
        run: |
          npm install --package-lock-only --legacy-peer-deps

      - name: Commit package-lock.json
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: add package-lock.json" && git push)

      - name: Install dependencies
        run: |
          npm install --legacy-peer-deps
          npm install --legacy-peer-deps @capacitor/core @capacitor/cli @capacitor/android

      - name: Build web assets
        run: npm run build

      - name: Add Android platform
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi

      - name: Configure Android, Keystore and Signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          node -e '
            const fs = require("fs");

            // 1. Bezpečné dekódovanie Keystore priamo do android/app/
            const rawBase64 = (process.env.KEYSTORE_BASE64 || "").replace(/\s+/g, "");
            fs.writeFileSync("android/app/release.keystore", Buffer.from(rawBase64, "base64"));

            // 2. Nastavenie SDK verzií v variables.gradle
            let vg = fs.readFileSync("android/variables.gradle", "utf8");
            vg = vg.replace(/minSdkVersion\s*=\s*[0-9]+/g, "minSdkVersion = 24");
            vg = vg.replace(/compileSdkVersion\s*=\s*[0-9]+/g, "compileSdkVersion = 36");
            vg = vg.replace(/targetSdkVersion\s*=\s*[0-9]+/g, "targetSdkVersion = 36");
            fs.writeFileSync("android/variables.gradle", vg);

            // 3. Nastavenie verzie 1.0.1, versionCode 3 a natívneho podpisovania v build.gradle
            let bg = fs.readFileSync("android/app/build.gradle", "utf8");
            bg = bg.replace(/versionCode\s+[0-9]+/g, "versionCode 3");
            bg = bg.replace(/versionName\s+"[^"]+"/g, "versionName \"1.0.1\"");

            const signingBlock = `
                signingConfigs {
                    release {
                        storeFile file("release.keystore")
                        storePassword "X5o9bGziMf"
                        keyAlias "msglitchapps"
                        keyPassword "X5o9bGziMf"
                    }
                }
            `;

            bg = bg.replace("buildTypes {", signingBlock + "\n    buildTypes {");
            bg = bg.replace(/release\s*\{/, "release {\n            signingConfig signingConfigs.release");
            fs.writeFileSync("android/app/build.gradle", bg);

            // 4. Potlačenie varovaní AGP pre SDK 36
            fs.appendFileSync("android/gradle.properties", "\nandroid.suppressUnsupportedCompileSdk=36\n");
          '

          npx cap sync android

      - name: Build Signed Android App Bundle (.aab)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew bundleRelease

      - name: Cleanup Keystore
        run: |
          rm -f android/app/release.keystore

      - name: Upload Signed AAB
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 7
