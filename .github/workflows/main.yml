name: Build and Sign AAB

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Generate package-lock.json
        run: |
          npm install --package-lock-only --legacy-peer-deps

      - name: Commit package-lock.json
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: add package-lock.json" && git push)

      - name: Install dependencies
        run: |
          npm install --legacy-peer-deps
          npm install --legacy-peer-deps @capacitor/core @capacitor/cli @capacitor/android

      - name: Build web assets
        run: npm run build

      - name: Add and Sync Android platform
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi

          # Nastavenie verzií SDK a verzie aplikácie (1.0.1, kód 3)
          sed -i 's/minSdkVersion = [0-9]*/minSdkVersion = 24/g' android/variables.gradle
          sed -i 's/compileSdkVersion = [0-9]*/compileSdkVersion = 36/g' android/variables.gradle
          sed -i 's/targetSdkVersion = [0-9]*/targetSdkVersion = 36/g' android/variables.gradle
          sed -i 's/versionCode [0-9]*/versionCode 3/g' android/app/build.gradle
          sed -i 's/versionName "[^"]*"/versionName "1.0.1"/g' android/app/build.gradle
          echo "android.suppressUnsupportedCompileSdk=36" >> android/gradle.properties

          npx cap sync android

      - name: Configure Keystore and Gradle Signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          # 1. Bezpečné binárne dekódovanie kľúča priamo do android/app/
          node -e 'fs.writeFileSync("android/app/release.keystore", Buffer.from(process.env.KEYSTORE_BASE64, "base64"))'

          # 2. Nastavenie natívneho podpisovania priamo v build.gradle bez použitia jarsigner
          sed -i '/buildTypes {/i \
              signingConfigs { \
                  release { \
                      storeFile file("release.keystore") \
                      storePassword "X5o9bGziMf" \
                      keyAlias "msglitchapps" \
                      keyPassword "X5o9bGziMf" \
                  } \
              }' android/app/build.gradle

          sed -i 's/buildTypes {/buildTypes {\n        release {\n            signingConfig signingConfigs.release/g' android/app/build.gradle

      - name: Build Signed Android App Bundle (.aab)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew bundleRelease

      - name: Cleanup Keystore
        run: |
          rm -f android/app/release.keystore

      - name: Upload Signed AAB
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 7
