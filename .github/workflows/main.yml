name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout kód
        uses: actions/checkout@v4

      - name: Nastavenie Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Nastavenie Java (JDK 21)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Inštalácia závislostí a zostavenie webu
        run: |
          npm install --legacy-peer-deps
          npm run build
          npm install --save-dev @capacitor/cli @capacitor/core @capacitor/android @capacitor/assets --legacy-peer-deps
          
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.matej.toddlersleep",
            "appName": "Toddler Sleep",
            "webDir": "dist"
          }
          EOF

          npx cap add android
          npx @capacitor/assets generate --android || true
          npx cap sync android

      - name: Oprava duplicitných Kotlin závislostí
        run: |
          cat << 'EOF' >> android/app/build.gradle

          configurations.all {
              resolutionStrategy {
                  force("org.jetbrains.kotlin:kotlin-stdlib:1.8.22")
                  force("org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22")
                  force("org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22")
              }
          }
          EOF

      - name: Zostavenie APK (Debug)
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Uloženie APK ako artefakt
        uses: actions/upload-artifact@v4
        with:
          name: toddler-sleep-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
