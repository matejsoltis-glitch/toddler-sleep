name: Build and Sign AAB

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Verify Keystore & Signing Secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          trap 'rm -f /tmp/check.keystore' EXIT

          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret KEYSTORE_BASE64 je prázdny alebo chýba v GitHub Secrets."
            exit 1
          fi
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 --decode > /tmp/check.keystore

          STORE_PASS="$(printf '%s' "$STORE_PASSWORD" | tr -d '\r\n')"
          if [ -z "$STORE_PASS" ]; then
            echo "::error::Secret STORE_PASSWORD je prázdny alebo chýba v GitHub Secrets."
            exit 1
          fi

          if ! KT_PASS="$STORE_PASS" keytool -list -keystore /tmp/check.keystore -storepass:env KT_PASS >/dev/null 2>&1; then
            TRIMMED_PASS="$(printf '%s' "$STORE_PASS" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
            if [ -n "$TRIMMED_PASS" ] && KT_PASS="$TRIMMED_PASS" keytool -list -keystore /tmp/check.keystore -storepass:env KT_PASS >/dev/null 2>&1; then
              STORE_PASS="$TRIMMED_PASS"
            else
              echo "::error::Secret STORE_PASSWORD nesedí s keystore v KEYSTORE_BASE64. Skontroluj v GitHub Settings -> Secrets presnú hodnotu STORE_PASSWORD a KEYSTORE_BASE64."
              exit 1
            fi
          fi
          echo "::add-mask::$STORE_PASS"

          ALIAS_VAL="$(printf '%s' "$KEY_ALIAS" | tr -d '\r\n')"
          if [ -z "$ALIAS_VAL" ]; then
            echo "::error::Secret KEY_ALIAS je prázdny alebo chýba v GitHub Secrets."
            exit 1
          fi

          if ! KT_PASS="$STORE_PASS" keytool -list -keystore /tmp/check.keystore -storepass:env KT_PASS -alias "$ALIAS_VAL" >/dev/null 2>&1; then
            TRIMMED_ALIAS="$(printf '%s' "$ALIAS_VAL" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
            if [ -n "$TRIMMED_ALIAS" ] && KT_PASS="$STORE_PASS" keytool -list -keystore /tmp/check.keystore -storepass:env KT_PASS -alias "$TRIMMED_ALIAS" >/dev/null 2>&1; then
              ALIAS_VAL="$TRIMMED_ALIAS"
            else
              echo "::error::Secret KEY_ALIAS sa nenašiel v keystore. Skontroluj presný názov aliasu kľúča v GitHub Secrets."
              exit 1
            fi
          fi
          echo "::add-mask::$ALIAS_VAL"

          echo "Keystore, heslo aj alias sú overené a sedia."

      - name: Install dependencies
        run: |
          npm install --legacy-peer-deps
          npm install --legacy-peer-deps @capacitor/core @capacitor/cli @capacitor/android @capacitor/assets

      - name: Build web assets
        run: npm run build

      - name: Add Android platform
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi

      - name: Generate Android App Icons from assets/icon.png
        run: |
          # 1. Príprava zdrojových súborov pre @capacitor/assets
          mkdir -p assets
          cp -f assets/icon.png assets/icon-only.png 2>/dev/null || true
          cp -f assets/icon.png assets/icon-foreground.png 2>/dev/null || true
          cp -f assets/icon.png assets/logo.png 2>/dev/null || true

          # 2. Automatické vygenerovanie cez @capacitor/assets
          npx @capacitor/assets generate --android --assetPath assets || true

          # 3. Istota: Priamy prevod do všetkých mipmap rozlíšení (mdpi, hdpi, xhdpi, xxhdpi, xxxhdpi)
          for density in "mdpi:48:108" "hdpi:72:162" "xhdpi:96:216" "xxhdpi:144:324" "xxxhdpi:192:432"; do
            IFS=":" read -r name size fg_size <<< "$density"
            dir="android/app/src/main/res/mipmap-$name"
            mkdir -p "$dir"
            if command -v convert >/dev/null 2>&1; then
              convert assets/icon.png -resize "${size}x${size}" "$dir/ic_launcher.png" || true
              convert assets/icon.png -resize "${size}x${size}" "$dir/ic_launcher_round.png" || true
              convert assets/icon.png -resize "${fg_size}x${fg_size}" "$dir/ic_launcher_foreground.png" || true
            fi
          done

      - name: Configure Android versions and Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          node -e '
            const fs = require("fs");

            // 1. Dekódovanie keystore zo secretu s obmedzenými oprávneniami
            const rawBase64 = (process.env.KEYSTORE_BASE64 || "").replace(/\s+/g, "");
            fs.writeFileSync("android/app/release.keystore", Buffer.from(rawBase64, "base64"), { mode: 0o600 });

            // 2. Nastavenie SDK 36 vo variables.gradle
            let vg = fs.readFileSync("android/variables.gradle", "utf8");
            vg = vg.replace(/minSdkVersion\s*=\s*[0-9]+/g, "minSdkVersion = 24");
            vg = vg.replace(/compileSdkVersion\s*=\s*[0-9]+/g, "compileSdkVersion = 36");
            vg = vg.replace(/targetSdkVersion\s*=\s*[0-9]+/g, "targetSdkVersion = 36");
            fs.writeFileSync("android/variables.gradle", vg);

            // 3. Nastavenie verzie 1.1.1 a versionCode 6
            let bg = fs.readFileSync("android/app/build.gradle", "utf8");
            bg = bg.replace(/versionCode\s+[0-9]+/g, "versionCode 6");
            bg = bg.replace(/versionName\s+"[^"]+"/g, "versionName \"1.1.1\"");
            fs.writeFileSync("android/app/build.gradle", bg);

            // 4. Potlačenie AGP kontroly pre SDK 36
            fs.appendFileSync("android/gradle.properties", "\nandroid.suppressUnsupportedCompileSdk=36\n");
          '

          npx cap sync android

      - name: Configure Immersive Sticky Fullscreen & Lock Screen Sleep Plugin
        run: |
          # 1. Nastavenie okna na fullscreen v styles.xml
          if [ -f "android/app/src/main/res/values/styles.xml" ]; then
            sed -i '/<\/style>/i \        <item name="android:windowFullscreen">true</item>\n        <item name="android:windowContentOverlay">@null</item>' android/app/src/main/res/values/styles.xml || true
          fi

          # 2. Pridanie povolenia POST_NOTIFICATIONS a receivera pre tiché pripomienky bdelého okna do AndroidManifest.xml
          node -e '
            const fs = require("fs");
            const manifestPath = "android/app/src/main/AndroidManifest.xml";
            if (fs.existsSync(manifestPath)) {
              let xml = fs.readFileSync(manifestPath, "utf8");
              if (!xml.includes("android.permission.POST_NOTIFICATIONS")) {
                xml = xml.replace(
                  /<manifest([^>]*)>/,
                  "<manifest$1>\n    <uses-permission android:name=\"android.permission.POST_NOTIFICATIONS\" />"
                );
              }
              if (!xml.includes("WakeWindowReminderReceiver")) {
                xml = xml.replace(
                  /<\/application>/,
                  "        <receiver android:name=\".WakeWindowReminderReceiver\" android:exported=\"false\" />\n    </application>"
                );
              }
              fs.writeFileSync(manifestPath, xml);
            }
          '

          # 3a. BroadcastReceiver pre tichú lokálnu pripomienku ideálneho bdelého okna (bez zvuku a vibrácií)
          mkdir -p android/app/src/main/java/com/matej/toddlersleep
          cat << 'EOF' > android/app/src/main/java/com/matej/toddlersleep/WakeWindowReminderReceiver.java
          package com.matej.toddlersleep;

          import android.Manifest;
          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.content.BroadcastReceiver;
          import android.content.Context;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.os.Build;
          import androidx.core.app.NotificationCompat;
          import androidx.core.app.NotificationManagerCompat;
          import androidx.core.content.ContextCompat;

          public class WakeWindowReminderReceiver extends BroadcastReceiver {
              public static final String WAKE_CHANNEL_ID = "wake_window_reminder_channel";
              public static final int WAKE_NOTIFICATION_ID = 4042;
              public static final String EXTRA_TITLE = "title";
              public static final String EXTRA_BODY = "body";
              public static final String EXTRA_CHANNEL_NAME = "channelName";

              public static void ensureChannel(Context context, String channelName) {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      NotificationManager manager = (NotificationManager) context.getSystemService(Context.NOTIFICATION_SERVICE);
                      if (manager == null) return;
                      String safeName = (channelName != null && !channelName.isEmpty()) ? channelName : "Wake Window Reminder";
                      NotificationChannel channel = new NotificationChannel(
                          WAKE_CHANNEL_ID,
                          safeName,
                          NotificationManager.IMPORTANCE_DEFAULT
                      );
                      channel.setSound(null, null);
                      channel.enableVibration(false);
                      channel.enableLights(false);
                      channel.setShowBadge(true);
                      channel.setLockscreenVisibility(Notification.VISIBILITY_PUBLIC);
                      manager.createNotificationChannel(channel);
                  }
              }

              public static void showSilentReminder(Context context, String title, String body, String channelName) {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU &&
                      ContextCompat.checkSelfPermission(context, Manifest.permission.POST_NOTIFICATIONS) != PackageManager.PERMISSION_GRANTED) {
                      return;
                  }
                  ensureChannel(context, channelName);

                  Intent launchIntent = new Intent(context, MainActivity.class);
                  launchIntent.setFlags(Intent.FLAG_ACTIVITY_SINGLE_TOP | Intent.FLAG_ACTIVITY_CLEAR_TOP);
                  PendingIntent contentIntent = PendingIntent.getActivity(
                      context,
                      WAKE_NOTIFICATION_ID,
                      launchIntent,
                      PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE
                  );

                  NotificationCompat.Builder builder = new NotificationCompat.Builder(context, WAKE_CHANNEL_ID)
                      .setSmallIcon(context.getApplicationInfo().icon)
                      .setContentTitle(title != null ? title : "Ideal sleep window approaching")
                      .setContentText(body != null ? body : "")
                      .setStyle(new NotificationCompat.BigTextStyle().bigText(body != null ? body : ""))
                      .setAutoCancel(true)
                      .setSilent(true)
                      .setCategory(NotificationCompat.CATEGORY_REMINDER)
                      .setPriority(NotificationCompat.PRIORITY_DEFAULT)
                      .setVisibility(NotificationCompat.VISIBILITY_PUBLIC)
                      .setContentIntent(contentIntent);

                  try {
                      NotificationManagerCompat.from(context).notify(WAKE_NOTIFICATION_ID, builder.build());
                  } catch (SecurityException ignored) {
                      // Gracefully ignore if notification permission was revoked
                  }
              }

              @Override
              public void onReceive(Context context, Intent intent) {
                  if (intent == null) return;
                  String title = intent.getStringExtra(EXTRA_TITLE);
                  String body = intent.getStringExtra(EXTRA_BODY);
                  String channelName = intent.getStringExtra(EXTRA_CHANNEL_NAME);
                  showSilentReminder(context, title, body, channelName);
              }
          }
          EOF

          # 3b. Natívny XML layout pre živý časovač (Chronometer) priamo v tele notifikácie (spoľahlivé na Redmi Note 11 / MIUI aj starších Androidoch)
          mkdir -p android/app/src/main/res/layout
          cat << 'EOF' > android/app/src/main/res/layout/notification_ongoing_sleep.xml
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="wrap_content"
              android:orientation="vertical">

              <LinearLayout
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:gravity="center_vertical"
                  android:orientation="horizontal">

                  <TextView
                      android:id="@+id/sleep_notif_title"
                      style="@style/TextAppearance.Compat.Notification.Title"
                      android:layout_width="0dp"
                      android:layout_height="wrap_content"
                      android:layout_weight="1"
                      android:ellipsize="end"
                      android:maxLines="1"
                      android:textStyle="bold" />

                  <Chronometer
                      android:id="@+id/sleep_notif_chronometer"
                      style="@style/TextAppearance.Compat.Notification.Title"
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:layout_marginStart="8dp"
                      android:fontFamily="monospace"
                      android:singleLine="true"
                      android:textStyle="bold" />
              </LinearLayout>

              <TextView
                  android:id="@+id/sleep_notif_body"
                  style="@style/TextAppearance.Compat.Notification.Line2"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:layout_marginTop="2dp"
                  android:ellipsize="end"
                  android:maxLines="1" />
          </LinearLayout>
          EOF

          # 3c. Natívny Capacitor plugin pre zamknutú obrazovku + tiché pripomienky bdelého okna
          cat << 'EOF' > android/app/src/main/java/com/matej/toddlersleep/SleepLockScreenNotificationPlugin.java
          package com.matej.toddlersleep;

          import android.Manifest;
          import android.app.AlarmManager;
          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.content.Context;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.os.Build;
          import android.os.SystemClock;
          import android.widget.RemoteViews;
          import androidx.core.app.NotificationCompat;
          import androidx.core.app.NotificationManagerCompat;
          import androidx.core.content.ContextCompat;
          import com.getcapacitor.JSObject;
          import com.getcapacitor.PermissionState;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;
          import com.getcapacitor.annotation.Permission;
          import com.getcapacitor.annotation.PermissionCallback;

          @CapacitorPlugin(
              name = "SleepLockScreenNotification",
              permissions = {
                  @Permission(
                      strings = { Manifest.permission.POST_NOTIFICATIONS },
                      alias = "notifications"
                  )
              }
          )
          public class SleepLockScreenNotificationPlugin extends Plugin {
              private static final String CHANNEL_ID = "ongoing_sleep_lockscreen_channel";
              private static final int NOTIFICATION_ID = 4041;

              private boolean hasNotificationPermission() {
                  if (Build.VERSION.SDK_INT < Build.VERSION_CODES.TIRAMISU) {
                      return true;
                  }
                  return ContextCompat.checkSelfPermission(
                      getContext(),
                      Manifest.permission.POST_NOTIFICATIONS
                  ) == PackageManager.PERMISSION_GRANTED;
              }

              private void ensureNotificationChannel(String channelName) {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      NotificationManager manager = (NotificationManager) getContext().getSystemService(Context.NOTIFICATION_SERVICE);
                      if (manager == null) return;
                      String safeName = (channelName != null && !channelName.isEmpty()) ? channelName : "Ongoing Sleep Tracker";
                      NotificationChannel channel = new NotificationChannel(
                          CHANNEL_ID,
                          safeName,
                          NotificationManager.IMPORTANCE_DEFAULT
                      );
                      channel.setSound(null, null);
                      channel.enableVibration(false);
                      channel.enableLights(false);
                      channel.setShowBadge(false);
                      channel.setLockscreenVisibility(Notification.VISIBILITY_PUBLIC);
                      manager.createNotificationChannel(channel);
                  }
              }

              private RemoteViews buildLiveChronometerViews(Context context, String title, String body, long startTimeMs) {
                  try {
                      long elapsedMs = Math.max(0L, System.currentTimeMillis() - startTimeMs);
                      long chronometerBase = SystemClock.elapsedRealtime() - elapsedMs;
                      RemoteViews views = new RemoteViews(context.getPackageName(), R.layout.notification_ongoing_sleep);
                      views.setTextViewText(R.id.sleep_notif_title, title);
                      views.setTextViewText(R.id.sleep_notif_body, body);
                      views.setChronometer(R.id.sleep_notif_chronometer, chronometerBase, null, true);
                      return views;
                  } catch (Exception ignored) {
                      return null;
                  }
              }

              private NotificationCompat.Builder buildOngoingSleepBuilder(
                  Context context,
                  String title,
                  String body,
                  long safeStartMs,
                  PendingIntent contentIntent
              ) {
                  NotificationCompat.Builder builder = new NotificationCompat.Builder(context, CHANNEL_ID)
                      .setSmallIcon(context.getApplicationInfo().icon)
                      .setContentTitle(title)
                      .setContentText(body)
                      .setWhen(safeStartMs)
                      .setShowWhen(true)
                      .setUsesChronometer(true)
                      .setOngoing(true)
                      .setAutoCancel(false)
                      .setOnlyAlertOnce(true)
                      .setSilent(true)
                      .setCategory(NotificationCompat.CATEGORY_STATUS)
                      .setPriority(NotificationCompat.PRIORITY_DEFAULT)
                      .setVisibility(NotificationCompat.VISIBILITY_PUBLIC)
                      .setContentIntent(contentIntent);

                  RemoteViews compactViews = buildLiveChronometerViews(context, title, body, safeStartMs);
                  if (compactViews != null) {
                      RemoteViews expandedViews = buildLiveChronometerViews(context, title, body, safeStartMs);
                      builder
                          .setStyle(new NotificationCompat.DecoratedCustomViewStyle())
                          .setCustomContentView(compactViews)
                          .setCustomBigContentView(expandedViews != null ? expandedViews : compactViews);
                  }
                  return builder;
              }

              @PluginMethod
              public void checkNotificationPermission(PluginCall call) {
                  JSObject ret = new JSObject();
                  ret.put("granted", hasNotificationPermission());
                  call.resolve(ret);
              }

              @PluginMethod
              public void requestNotificationPermission(PluginCall call) {
                  if (hasNotificationPermission()) {
                      JSObject ret = new JSObject();
                      ret.put("granted", true);
                      call.resolve(ret);
                      return;
                  }
                  requestPermissionForAlias("notifications", call, "notificationsPermsCallback");
              }

              @PermissionCallback
              private void notificationsPermsCallback(PluginCall call) {
                  boolean granted = getPermissionState("notifications") == PermissionState.GRANTED || hasNotificationPermission();
                  JSObject ret = new JSObject();
                  ret.put("granted", granted);
                  call.resolve(ret);
              }

              @PluginMethod
              public void showOngoingSleep(PluginCall call) {
                  if (!hasNotificationPermission()) {
                      JSObject ret = new JSObject();
                      ret.put("shown", false);
                      ret.put("reason", "permission_denied");
                      call.resolve(ret);
                      return;
                  }

                  String title = call.getString("title", "Baby is sleeping");
                  String body = call.getString("body", "");
                  String channelName = call.getString("channelName", "Ongoing Sleep Tracker");
                  long rawStartMs = call.getData().optLong("startTimeMs", System.currentTimeMillis());
                  long safeStartMs = rawStartMs > 0L ? rawStartMs : System.currentTimeMillis();

                  ensureNotificationChannel(channelName);

                  Context context = getContext();
                  Intent launchIntent = new Intent(context, MainActivity.class);
                  launchIntent.setFlags(Intent.FLAG_ACTIVITY_SINGLE_TOP | Intent.FLAG_ACTIVITY_CLEAR_TOP);

                  PendingIntent contentIntent = PendingIntent.getActivity(
                      context,
                      NOTIFICATION_ID,
                      launchIntent,
                      PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE
                  );

                  // Public version guarantees live ticking Chronometer is visible even when MIUI/Android hides sensitive lock screen content
                  Notification publicNotification = buildOngoingSleepBuilder(
                      context,
                      title,
                      body,
                      safeStartMs,
                      contentIntent
                  ).build();

                  NotificationCompat.Builder builder = buildOngoingSleepBuilder(
                      context,
                      title,
                      body,
                      safeStartMs,
                      contentIntent
                  ).setPublicVersion(publicNotification);

                  try {
                      NotificationManagerCompat.from(context).notify(NOTIFICATION_ID, builder.build());
                      JSObject ret = new JSObject();
                      ret.put("shown", true);
                      call.resolve(ret);
                  } catch (SecurityException se) {
                      JSObject ret = new JSObject();
                      ret.put("shown", false);
                      ret.put("reason", "security_exception");
                      call.resolve(ret);
                  }
              }

              @PluginMethod
              public void hideOngoingSleep(PluginCall call) {
                  NotificationManagerCompat.from(getContext()).cancel(NOTIFICATION_ID);
                  JSObject ret = new JSObject();
                  ret.put("hidden", true);
                  call.resolve(ret);
              }

              @PluginMethod
              public void scheduleWakeReminder(PluginCall call) {
                  if (!hasNotificationPermission()) {
                      JSObject ret = new JSObject();
                      ret.put("scheduled", false);
                      ret.put("reason", "permission_denied");
                      call.resolve(ret);
                      return;
                  }

                  String title = call.getString("title", "Ideal sleep window approaching");
                  String body = call.getString("body", "");
                  String channelName = call.getString("channelName", "Wake Window Reminder");
                  long triggerAtMs = call.getData().optLong("triggerAtMs", 0L);

                  if (triggerAtMs <= System.currentTimeMillis()) {
                      JSObject ret = new JSObject();
                      ret.put("scheduled", false);
                      ret.put("reason", "past_time");
                      call.resolve(ret);
                      return;
                  }

                  Context context = getContext();
                  WakeWindowReminderReceiver.ensureChannel(context, channelName);

                  Intent alarmIntent = new Intent(context, WakeWindowReminderReceiver.class);
                  alarmIntent.putExtra(WakeWindowReminderReceiver.EXTRA_TITLE, title);
                  alarmIntent.putExtra(WakeWindowReminderReceiver.EXTRA_BODY, body);
                  alarmIntent.putExtra(WakeWindowReminderReceiver.EXTRA_CHANNEL_NAME, channelName);

                  PendingIntent pendingIntent = PendingIntent.getBroadcast(
                      context,
                      WakeWindowReminderReceiver.WAKE_NOTIFICATION_ID,
                      alarmIntent,
                      PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE
                  );

                  AlarmManager alarmManager = (AlarmManager) context.getSystemService(Context.ALARM_SERVICE);
                  if (alarmManager != null) {
                      alarmManager.cancel(pendingIntent);
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                          alarmManager.setAndAllowWhileIdle(AlarmManager.RTC_WAKEUP, triggerAtMs, pendingIntent);
                      } else {
                          alarmManager.set(AlarmManager.RTC_WAKEUP, triggerAtMs, pendingIntent);
                      }
                  }

                  JSObject ret = new JSObject();
                  ret.put("scheduled", true);
                  call.resolve(ret);
              }

              @PluginMethod
              public void cancelWakeReminder(PluginCall call) {
                  Context context = getContext();
                  Intent alarmIntent = new Intent(context, WakeWindowReminderReceiver.class);
                  PendingIntent pendingIntent = PendingIntent.getBroadcast(
                      context,
                      WakeWindowReminderReceiver.WAKE_NOTIFICATION_ID,
                      alarmIntent,
                      PendingIntent.FLAG_NO_CREATE | PendingIntent.FLAG_IMMUTABLE
                  );
                  if (pendingIntent != null) {
                      AlarmManager alarmManager = (AlarmManager) context.getSystemService(Context.ALARM_SERVICE);
                      if (alarmManager != null) {
                          alarmManager.cancel(pendingIntent);
                      }
                      pendingIntent.cancel();
                  }
                  NotificationManagerCompat.from(context).cancel(WakeWindowReminderReceiver.WAKE_NOTIFICATION_ID);
                  JSObject ret = new JSObject();
                  ret.put("cancelled", true);
                  call.resolve(ret);
              }

              @PluginMethod
              public void showInstantWakeReminder(PluginCall call) {
                  if (!hasNotificationPermission()) {
                      JSObject ret = new JSObject();
                      ret.put("shown", false);
                      ret.put("reason", "permission_denied");
                      call.resolve(ret);
                      return;
                  }
                  String title = call.getString("title", "Wake Window Reminder");
                  String body = call.getString("body", "");
                  String channelName = call.getString("channelName", "Wake Window Reminder");
                  WakeWindowReminderReceiver.showSilentReminder(getContext(), title, body, channelName);
                  JSObject ret = new JSObject();
                  ret.put("shown", true);
                  call.resolve(ret);
              }
          }
          EOF

          # 4. Registrácia pluginu + Immersive Sticky režim v MainActivity.java pre staršie aj novšie Android zariadenia
          cat << 'EOF' > android/app/src/main/java/com/matej/toddlersleep/MainActivity.java
          package com.matej.toddlersleep;

          import android.os.Bundle;
          import android.view.View;
          import android.view.WindowManager;
          import androidx.core.view.WindowCompat;
          import androidx.core.view.WindowInsetsCompat;
          import androidx.core.view.WindowInsetsControllerCompat;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  registerPlugin(SleepLockScreenNotificationPlugin.class);
                  super.onCreate(savedInstanceState);
                  getWindow().addFlags(WindowManager.LayoutParams.FLAG_FULLSCREEN);
                  hideSystemUI();
              }

              @Override
              public void onWindowFocusChanged(boolean hasFocus) {
                  super.onWindowFocusChanged(hasFocus);
                  if (hasFocus) {
                      hideSystemUI();
                  }
              }

              private void hideSystemUI() {
                  // Podpora pre moderné Android zariadenia (API 30+)
                  WindowCompat.setDecorFitsSystemWindows(getWindow(), false);
                  WindowInsetsControllerCompat controller = new WindowInsetsControllerCompat(getWindow(), getWindow().getDecorView());
                  controller.hide(WindowInsetsCompat.Type.systemBars());
                  controller.setSystemBarsBehavior(WindowInsetsControllerCompat.BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE);

                  // Vynútenie Immersive Sticky režimu pre staršie Android verzie (skrytie navigačnej aj stavovej lišty)
                  getWindow().getDecorView().setSystemUiVisibility(
                      View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY
                      | View.SYSTEM_UI_FLAG_LAYOUT_STABLE
                      | View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION
                      | View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN
                      | View.SYSTEM_UI_FLAG_HIDE_NAVIGATION
                      | View.SYSTEM_UI_FLAG_FULLSCREEN
                  );
              }
          }
          EOF

      - name: Build Signed Android App Bundle (.aab)
        working-directory: android
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          STORE_PASS="$(printf '%s' "$STORE_PASSWORD" | tr -d '\r\n')"
          if ! KT_PASS="$STORE_PASS" keytool -list -keystore app/release.keystore -storepass:env KT_PASS >/dev/null 2>&1; then
            STORE_PASS="$(printf '%s' "$STORE_PASS" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          fi

          ALIAS_VAL="$(printf '%s' "$KEY_ALIAS" | tr -d '\r\n')"
          if ! KT_PASS="$STORE_PASS" keytool -list -keystore app/release.keystore -storepass:env KT_PASS -alias "$ALIAS_VAL" >/dev/null 2>&1; then
            ALIAS_VAL="$(printf '%s' "$ALIAS_VAL" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          fi

          KEY_PASS="$(printf '%s' "$KEY_PASSWORD" | tr -d '\r\n')"
          TRIMMED_KEY_PASS="$(printf '%s' "$KEY_PASS" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          if [ -z "$TRIMMED_KEY_PASS" ] || [ "$TRIMMED_KEY_PASS" = "$STORE_PASS" ]; then
            KEY_PASS="$STORE_PASS"
          fi

          [ -n "$STORE_PASS" ] && echo "::add-mask::$STORE_PASS"
          [ -n "$ALIAS_VAL" ] && echo "::add-mask::$ALIAS_VAL"
          [ -n "$KEY_PASS" ] && echo "::add-mask::$KEY_PASS"

          chmod +x gradlew
          ./gradlew bundleRelease \
            -Pandroid.injected.signing.store.file="$(pwd)/app/release.keystore" \
            -Pandroid.injected.signing.store.password="$STORE_PASS" \
            -Pandroid.injected.signing.key.alias="$ALIAS_VAL" \
            -Pandroid.injected.signing.key.password="$KEY_PASS"

      - name: Cleanup Keystore
        if: always()
        run: |
          rm -f android/app/release.keystore

      - name: Upload Signed Android App Bundle (.aab)
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 7
