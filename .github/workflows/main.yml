name: Generate Keystore

on:
  workflow_dispatch:

jobs:
  create-keystore:
    runs-on: ubuntu-latest
    steps:
      - name: Nastavenie Java (JDK 21)
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Vytvorenie kluca
        run: |
          keytool -genkeypair -v -keystore my-release-key.jks \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -alias msglitchapps \
            -storepass X5o9bGziMf \
            -keypass X5o9bGziMf \
            -dname "CN=Matej Soltis, OU=Mobile, O=Apps, L=Bratislava, ST=Slovakia, C=SK"

      - name: Ulozenie kluca ako artefakt
        uses: actions/upload-artifact@v4
        with:
          name: release-keystore
          path: my-release-key.jks
