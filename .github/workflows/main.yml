name: Build Android APK

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout kód
        uses: actions/checkout@v4

      - name: Nastavenie Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Nastavenie Java (JDK 21)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Inštalácia závislostí a zostavenie webu
        run: |
          npm install --legacy-peer-deps
          npm run build
          npm install --save-dev @capacitor/cli @capacitor/core @capacitor/android @capacitor/assets --legacy-peer-deps
          
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.matej.toddlersleep",
            "appName": "Toddler sleep assistant",
            "webDir": "dist"
          }
          EOF

          npx cap add android
          npx @capacitor/assets generate --android || true
          npx cap sync android

      - name: Nastavenie celej obrazovky (Immersive Fullscreen)
        run: |
          # 1. Nastavenie priamo v XML teme Androidu
          sed -i '/<\/style>/i \        <item name="android:windowFullscreen">true</item>\n        <item name="android:windowContentOverlay">@null</item>' android/app/src/main/res/values/styles.xml

          # 2. Nastavenie v Java kode - aplikovanie pri vytvoreni aj pri zaostreni okna
          cat << 'EOF' > android/app/src/main/java/com/matej/toddlersleep/MainActivity.java
          package com.matej.toddlersleep;

          import android.os.Bundle;
          import android.view.View;
          import android.view.WindowManager;
          import androidx.core.view.WindowCompat;
          import androidx.core.view.WindowInsetsCompat;
          import androidx.core.view.WindowInsetsControllerCompat;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  getWindow().addFlags(WindowManager.LayoutParams.FLAG_FULLSCREEN);
                  hideSystemUI();
              }

              @Override
              public void onWindowFocusChanged(boolean hasFocus) {
                  super.onWindowFocusChanged(hasFocus);
                  if (hasFocus) {
                      hideSystemUI();
                  }
              }

              private void hideSystemUI() {
                  WindowCompat.setDecorFitsSystemWindows(getWindow(), false);
                  WindowInsetsControllerCompat controller = new WindowInsetsControllerCompat(getWindow(), getWindow().getDecorView());
                  controller.hide(WindowInsetsCompat.Type.systemBars());
                  controller.setSystemBarsBehavior(WindowInsetsControllerCompat.BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE);

                  // Poistka pre starsie API a nadstavby vyrobcov
                  getWindow().getDecorView().setSystemUiVisibility(
                      View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY
                      | View.SYSTEM_UI_FLAG_LAYOUT_STABLE
                      | View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION
                      | View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN
                      | View.SYSTEM_UI_FLAG_HIDE_NAVIGATION
                      | View.SYSTEM_UI_FLAG_FULLSCREEN
                  );
              }
          }
          EOF

      - name: Oprava duplicitných Kotlin závislostí
        run: |
          cat << 'EOF' >> android/app/build.gradle

          configurations.all {
              resolutionStrategy {
                  force("org.jetbrains.kotlin:kotlin-stdlib:1.8.22")
                  force("org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22")
                  force("org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22")
              }
          }
          EOF

      - name: Zostavenie APK (Debug)
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Uloženie APK ako artefakt
        uses: actions/upload-artifact@v4
        with:
          name: toddler-sleep-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
