name: Build and Sign AAB

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android Platform 36 & Build-Tools
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Generate package-lock.json
        run: |
          npm install --package-lock-only --legacy-peer-deps

      - name: Commit package-lock.json
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: add package-lock.json" && git push)

      - name: Install dependencies
        run: |
          npm install --legacy-peer-deps
          npm install --legacy-peer-deps @capacitor/core @capacitor/cli @capacitor/android

      - name: Build web assets
        run: npm run build

      - name: Add and Sync Android platform
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi

          # Nastavenie presných SDK verzií pre API 36
          sed -i 's/minSdkVersion = [0-9]*/minSdkVersion = 24/g' android/variables.gradle
          sed -i 's/compileSdkVersion = [0-9]*/compileSdkVersion = 36/g' android/variables.gradle
          sed -i 's/targetSdkVersion = [0-9]*/targetSdkVersion = 36/g' android/variables.gradle

          # Nastavenie versionCode 3 a verzie 1.0.1
          sed -i 's/versionCode [0-9]*/versionCode 3/g' android/app/build.gradle
          sed -i 's/versionName "[^"]*"/versionName "1.0.1"/g' android/app/build.gradle

          # Potlačenie varovaní o verzii Android Gradle Pluginu
          echo "android.suppressUnsupportedCompileSdk=36" >> android/gradle.properties

          npx cap sync android

      - name: Build Android App Bundle (.aab)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew bundleRelease

      - name: Sign Android App Bundle via Secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          # Dekódovanie keystore zo secretu
          echo "$KEYSTORE_BASE64" | base64 --decode > temp_release.keystore

          # Podpísanie vygenerovaného balíka
          jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 \
            -keystore temp_release.keystore \
            -storepass "$KEYSTORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            android/app/build/outputs/bundle/release/app-release.aab "$KEY_ALIAS"

          # Bezpečné odstránenie dočasného kľúča
          rm -f temp_release.keystore

      - name: Upload Signed AAB
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 7
